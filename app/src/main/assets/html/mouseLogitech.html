<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { font-family: sans-serif; margin: 12px; background: #f0f3f5; }
        .card { background: #fff; border: 2px solid #00b4ff; border-radius: 15px; padding: 15px; }
        h2 { color: #004a99; margin: 0 0 10px 0; }
        .spec { font-size: 13px; color: #555; margin-bottom: 5px; }
        .icon { color: #00b4ff; margin-right: 5px; }
    </style>
</head>
<body>
<div class="card">
    <h2>Logitech G502 X</h2>
    <div class="spec"><span class="icon">●</span>Сенсор HERO 25K</div>
    <div class="spec"><span class="icon">●</span>Гибридные свитчи LIGHTFORCE</div>
    <div class="spec"><span class="icon">●</span>13 программируемых кнопок</div>
    <div class="spec"><span class="icon">●</span>Вес: 89 грамм</div>
</div>
</body>
</html>
