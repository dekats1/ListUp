<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 12px; background: #000; color: #fff; }
        h2 { color: #ff0000; border-bottom: 2px solid #ff0000; padding-bottom: 5px; }
        .specs { margin-top: 15px; }
        .spec-item { display: flex; padding: 8px; background: #1a1a1a; margin-bottom: 4px; border-radius: 4px; }
        .spec-item b { width: 110px; color: #ff0000; font-size: 13px; }
        .spec-item span { font-size: 14px; }
        .cooling { border: 1px dashed #ff0000; padding: 10px; margin-top: 10px; font-size: 12px; text-align: center; }
    </style>
</head>
<body>
<h2>MSI Codex 6 14NUC5</h2>
<div class="specs">
    <div class="spec-item"><b>CPU</b><span>Intel Core i5-14400F</span></div>
    <div class="spec-item"><b>GPU</b><span>MSI RTX 4060 Ventus 8GB</span></div>
    <div class="spec-item"><b>RAM</b><span>16GB DDR5 5600MHz</span></div>
    <div class="spec-item"><b>Storage</b><span>1TB NVMe Gen4 SSD</span></div>
    <div class="spec-item"><b>Case</b><span>MSI Codex (Custom RGB)</span></div>
</div>
<div class="cooling">Система охлаждения с оптимизированным воздушным потоком Air Inlet.</div>
</body>
</html>
