<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { font-family: sans-serif; margin: 0; background: #fdfdfd; color: #111; }
        .hero { background: #eef2f7; padding: 20px; text-align: center; }
        h2 { margin: 0; font-weight: 300; }
        .ai-badge { color: #4285f4; font-weight: bold; font-size: 12px; }
        .details { padding: 15px; }
        .spec { margin-bottom: 10px; font-size: 14px; display: flex; align-items: center; }
        .spec-icon { width: 24px; margin-right: 10px; text-align: center; }
        .stylus { border: 1px solid #ccc; padding: 8px; border-radius: 8px; margin-top: 10px; font-size: 12px; }
    </style>
</head>
<body>
<div class="hero">
    <span class="ai-badge">✨ Galaxy AI is here</span>
    <h2>Galaxy S25 Ultra</h2>
</div>
<div class="details">
    <div class="spec"><b>Экран:</b> &nbsp; 6.8" Dynamic AMOLED 2X</div>
    <div class="spec"><b>Камера:</b> &nbsp; 200 Мп + 50 Мп Перископ</div>
    <div class="spec"><b>Чип:</b> &nbsp; Snapdragon 8 Gen 4 for Galaxy</div>
    <div class="spec"><b>Батарея:</b> &nbsp; 5000 мАч + 45 Вт</div>
    <div class="stylus">🖊️ Встроенное перо S Pen с поддержкой жестов.</div>
</div>
</body>
</html>
