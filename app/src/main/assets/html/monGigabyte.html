<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { font-family: sans-serif; margin: 12px; background: #121212; color: #fff; }
        .header { border-left: 4px solid #f2ff00; padding-left: 10px; }
        h2 { margin: 0; color: #f2ff00; }
        .stats { margin-top: 15px; }
        .stat-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #333; }
        .stat-row span { color: #888; }
        .highlight { color: #f2ff00; font-weight: bold; }
    </style>
</head>
<body>
<div class="header"><h2>Gigabyte G24F 2</h2><p>SuperSpeed IPS панель</p></div>
<div class="stats">
    <div class="stat-row"><span>Размер</span><span class="highlight">23.8 дюйма</span></div>
    <div class="stat-row"><span>Разрешение</span><span class="highlight">1920 x 1080</span></div>
    <div class="stat-row"><span>Частота</span><span class="highlight">165 Гц (OC 180 Гц)</span></div>
    <div class="stat-row"><span>Цветопередача</span><span class="highlight">95% DCI-P3</span></div>
</div>
<p style="font-size: 13px; color: #aaa; margin-top: 15px;">Функция OSD Sidekick позволяет настраивать параметры монитора с помощью мыши и клавиатуры.</p>
</body>
</html>
