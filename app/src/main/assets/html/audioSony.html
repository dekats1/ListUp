<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { font-family: sans-serif; margin: 12px; background: #ebebeb; color: #222; }
        .anc-badge { border: 2px solid #222; padding: 5px; text-align: center; font-weight: bold; margin-bottom: 15px; }
        h2 { margin: 0; font-size: 18px; }
        .row { display: flex; justify-content: space-between; margin: 8px 0; font-size: 14px; border-bottom: 1px solid #ccc; }
    </style>
</head>
<body>
<div class="anc-badge">ЛУЧШЕЕ ШУМОПОДАВЛЕНИЕ</div>
<h2>Sony WH-1000XM5</h2>
<div class="row"><span>Драйвер</span><span>30 мм (Precision-engineered)</span></div>
<div class="row"><span>Микрофоны</span><span>8 микрофонов для ANC</span></div>
<div class="row"><span>Зарядка</span><span>30 часов (3 мин = 3 ч)</span></div>
<div class="row"><span>Кодеки</span><span>LDAC, AAC, SBC</span></div>
</body>
</html>
