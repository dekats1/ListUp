<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 12px; background: #0c0c0c; color: #eee; }
        h2 { color: #a50034; border-bottom: 2px solid #a50034; display: inline-block; }
        .nano-ips { background: #a50034; color: white; padding: 4px 10px; border-radius: 4px; font-size: 12px; font-weight: bold; margin-bottom: 15px; }
        .spec-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
        .spec-card { background: #1a1a1a; padding: 10px; border-radius: 6px; border-left: 3px solid #a50034; }
        .spec-card b { display: block; font-size: 11px; color: #888; text-transform: uppercase; }
        .feature-list { margin-top: 15px; font-size: 13px; color: #bbb; }
    </style>
</head>
<body>
<h2>LG UltraGear 27GN800</h2><br>
<span class="nano-ips">G-SYNC® COMPATIBLE</span>
<div class="spec-grid">
    <div class="spec-card"><b>Матрица</b><span>27" IPS QHD</span></div>
    <div class="spec-card"><b>Частота</b><span>144 Гц</span></div>
    <div class="spec-card"><b>Отклик</b><span>1 мс (GtG)</span></div>
    <div class="spec-card"><b>Цвет</b><span>sRGB 99% / HDR10</span></div>
</div>
<ul class="feature-list">
    <li>Дизайн практически без рамок</li>
    <li>Технология AMD FreeSync™ Premium</li>
    <li>Dynamic Action Sync (минимизация задержек)</li>
    <li>Стабилизатор черного для видимости в темноте</li>
</ul>
</body>
</html>
