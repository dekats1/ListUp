<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { font-family: sans-serif; margin: 12px; background: #001d3d; color: #fff; }
        h2 { color: #00abff; }
        .tag { background: #00abff; color: #fff; padding: 2px 8px; border-radius: 10px; font-size: 11px; }
        .spec-list { margin-top: 15px; list-style: none; padding: 0; }
        .spec-list li { padding: 6px 0; border-bottom: 1px solid #003566; font-size: 13px; }
    </style>
</head>
<body>
<h2>Logitech G Pro X <span class="tag">TKL</span></h2>
<ul class="spec-list">
    <li><b>Переключатели:</b> Сменные GX Blue/Brown/Red</li>
    <li><b>Подсветка:</b> RGB LIGHTSYNC</li>
    <li><b>Кабель:</b> Съемный Micro-USB</li>
    <li><b>Профили:</b> Встроенная память (1 профиль)</li>
</ul>
</body>
</html>
