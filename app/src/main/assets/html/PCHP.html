<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { font-family: sans-serif; margin: 12px; background: #f4f4f4; color: #333; }
        .top-line { height: 5px; background: #001219; }
        h2 { color: #001219; margin-top: 10px; }
        .tag { background: #005f73; color: #fff; padding: 3px 8px; border-radius: 3px; font-size: 11px; }
        .grid { margin-top: 15px; }
        .row { border-bottom: 1px solid #ddd; padding: 7px 0; font-size: 14px; }
    </style>
</head>
<body>
<div class="top-line"></div>
<h2>HP Victus 15L TG02</h2>
<span class="tag">Офис + Гейминг</span>
<div class="grid">
    <div class="row"><b>Процессор:</b> Ryzen 5 5600G</div>
    <div class="row"><b>Видеокарта:</b> RX 6400 4GB</div>
    <div class="row"><b>Память:</b> 16GB DDR4</div>
    <div class="row"><b>Диск:</b> 512GB SSD</div>
</div>
</body>
</html>
