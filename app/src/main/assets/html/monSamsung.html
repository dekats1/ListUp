<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 12px; background: #0a0e14; color: #e0e6ed; }
        h2 { color: #00c8ff; text-shadow: 0 0 10px rgba(0,200,255,0.3); }
        .curve-tag { background: #00c8ff; color: #000; font-weight: bold; padding: 4px 10px; border-radius: 4px; display: inline-block; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .item { background: #161d27; padding: 10px; border-radius: 8px; border: 1px solid #232d3d; }
        .item small { color: #00c8ff; display: block; font-size: 11px; text-transform: uppercase; }
        .item span { font-size: 15px; font-weight: bold; }
        .features { margin-top: 15px; padding: 10px; background: rgba(0,200,255,0.05); border-radius: 8px; font-size: 13px; }
        .features li { margin-bottom: 5px; color: #b0b8c1; }
    </style>
</head>
<body>
<h2>Samsung Odyssey G5</h2>
<div class="curve-tag">Кривизна 1000R</div>
<div class="grid">
    <div class="item"><small>Разрешение</small><span>2560x1440 (2K)</span></div>
    <div class="item"><small>Частота</small><span>165 Гц</span></div>
    <div class="item"><small>Отклик</small><span>1 мс (MPRT)</span></div>
    <div class="item"><small>Тип матрицы</small><span>VA</span></div>
</div>
<div class="features">
    <strong>Игровые технологии:</strong>
    <ul>
        <li>AMD FreeSync Premium</li>
        <li>HDR10 для сочной картинки</li>
        <li>Режим Eye Saver (защита глаз)</li>
        <li>Black Equalizer (видимость в тенях)</li>
    </ul>
</div>
</body>
</html>
